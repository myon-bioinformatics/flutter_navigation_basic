name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management / navigation (high-coupling legacy dependency; audited,
  # retained for a separate staged migration instead of a risky bulk rewrite).
  get: ^4.6.6

  # Local storage (isolated behind StorageService).
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/screens.json
    - assets/ui_showcase.json
