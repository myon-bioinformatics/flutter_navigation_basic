name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Reference-catalogue compatibility only. The production/handcrafted app shell
  # is Flutter-native; remaining GetX usage is isolated to historical patterns.
  get: ^4.7.3

  # Local storage (isolated behind StorageService).
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/screens.json
    - assets/ui_showcase.json
