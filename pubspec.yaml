name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

# Product release (before +) vs store/CI build counter (after +).
# Git SHA is never encoded here — it ships separately in build diagnostics.
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter

  # Reference-catalogue compatibility only. The production/handcrafted app shell
  # is Flutter-native; remaining GetX usage is isolated to historical patterns.
  gal: ^2.3.3
  get: ^4.7.3

  # Local storage (isolated behind StorageService).
  image_picker: ^1.2.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/screens.json
    - assets/ui_showcase.json
    - assets/diagnostics/build_metadata.json
    - assets/display/app_text.json
    - assets/time/zone_table.json
    - assets/data_processing/filter_basic.json
    - assets/data_processing/filter_multiple.json
    - assets/data_processing/filter_nested.json
    - assets/data_processing/distinct_filter.json
    - assets/data_processing/deduplicate_report.json
    - assets/data_processing/sort_basic.json
    - assets/data_processing/sort_multi_key.json
    - assets/data_processing/sort_reverse.json
    - assets/data_processing/search_basic.json
    - assets/data_processing/text_index.json
    - assets/data_processing/inverted_index.json
    - assets/data_processing/stop_word.json
    - assets/data_processing/sorted_set.json
    - assets/data_processing/priority_queue.json
    - assets/data_processing/top_n.json
    - assets/data_processing/window_034.json
    - assets/data_processing/window_036.json
    - assets/data_processing/window_038.json
    - assets/data_processing/window_039.json
    - assets/data_processing/window_040.json
    - assets/data_processing/window_041.json
    - assets/data_processing/window_042.json
    - assets/data_processing/window_043.json
    - assets/data_processing/window_037.json
    - assets/data_processing/window_044.json
    - assets/data_processing/structure_045.json
    - assets/data_processing/structure_046.json
