# 番号付き route /screen001〜/screen198 の行き先（期待値）。
# このファイルは人が書く。機械では生成しない。
#
# - 実測: test/core/navigation/numbered_routes_observation_test.dart が 198 本の route を
#   実行時に解決し、build/route-observations.json に Widget の種別と id を書き出す。
# - 判定: tool/python/check_route_observations.py がこのファイルと実測を照合し、
#   件数・種別・id のどれかが違えば CI を落とす（route を足して更新し忘れても気づける）。
# - 監査: tool/python/pattern_responsibility_audit.py がこのファイルを route の証跡として読む。

schema = "numbered-routes/1"
generic_widget = "GenericScreen"

# 共通 Widget（パターンごとの view.dart ではなく lib/core の実装）
[shared_widgets]
InteractivePatternExample = "ネイティブ操作の共通 Widget（並べ替え・挿入・削除・選択）"
ValidationPatternLinks = "Python 検証 producer へのソースリンク（Pages では deploy commit に固定）"
ConversionPatternLinks = "Python 変換 producer へのソースリンク"
NativeParallelPatternExample = "Dart Isolate / compute のネイティブ例"

