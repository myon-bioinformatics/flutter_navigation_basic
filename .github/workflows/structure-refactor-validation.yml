name: Refactor smoke

# A lightweight, reusable gate for stacked refactoring branches.
# The broad main-targeted matrix remains the integration gate.
on:
  push:
    branches:
      - 'work/**'
  pull_request:
    branches:
      - main
      - 'work/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/python/**'
      - 'tool/javascript/**'
      - 'assets/data_processing/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/structure-refactor-validation.yml'
  workflow_dispatch:

concurrency:
  group: refactor-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python producer regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install 'pytest>=8'
      - name: Verify Python boundaries and producer/asset parity
        run: python -m pytest tool/python/tests/test_pattern_catalogue_boundary.py tool/python/tests/test_collection_assets.py tool/python/tests/test_collection_transform.py tool/python/tests/test_state_reducer.py tool/python/tests/test_workflow_patterns.py tool/python/tests/test_pattern_responsibility_audit.py -q --junitxml=python-refactor-junit.xml
      - name: Export responsibility inventory
        run: python -S tool/python/pattern_responsibility_audit.py --json --check > pattern-responsibility.json
      - name: Upload responsibility inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-pattern-responsibility
          path: pattern-responsibility.json
          if-no-files-found: ignore
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-refactor-junit
          path: python-refactor-junit.xml
          if-no-files-found: error

  flutter:
    name: Flutter shared boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: flutter pub get
      - name: Shared data-processing widget tests
        run: |
          mkdir -p build/test-results
          flutter test test/features/data_processing_patterns/structure_assets_test.dart test/features/data_processing_patterns/command_assets_test.dart test/features/data_processing_patterns/legacy_catalogue_views_test.dart test/features/data_processing_patterns/native_state_catalogue_test.dart test/features/data_processing_patterns/native_notifier_test.dart test/features/data_processing_patterns/inherited_catalogue_test.dart test/features/data_processing_patterns/state_architecture_test.dart test/features/data_processing_patterns/counter_architecture_test.dart test/features/data_processing_patterns/interactive_pattern_example_test.dart --reporter expanded --file-reporter json:build/test-results/flutter-events.jsonl
      - name: Convert and validate Flutter JUnit
        if: always()
        run: |
          set -euo pipefail
          python3 -S tool/python/flutter_machine_junit.py build/test-results/flutter-events.jsonl build/test-results/flutter.xml
          python3 -S tool/python/validate_runner_junit.py build/test-results/flutter.xml
      - name: Preserve Flutter JUnit and raw events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-flutter-refactor
          path: |
            build/test-results/flutter.xml
            build/test-results/flutter-events.jsonl
          if-no-files-found: error
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos
      - name: Build Flutter web
        run: flutter build web

  node:
    name: JavaScript async boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute real Node tests with native JUnit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/test-results
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=build/test-results/node.xml \
            tool/javascript/tests/*.test.mjs
      - name: Validate native JUnit report
        if: always()
        run: python3 -S tool/python/validate_runner_junit.py build/test-results/node.xml
      - name: Preserve Node JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-node-refactor
          path: build/test-results/node.xml
          if-no-files-found: error
