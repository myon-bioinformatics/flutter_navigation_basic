name: Refactor smoke

# A lightweight, reusable gate for stacked refactoring branches.
# The broad main-targeted matrix remains the integration gate.
on:
  push:
    branches:
      - 'work/**'
  pull_request:
    branches:
      - main
      - 'work/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/python/**'
      - 'tool/javascript/**'
      - 'assets/data_processing/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/structure-refactor-validation.yml'
  workflow_dispatch:

concurrency:
  group: refactor-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python producer regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install 'pytest>=8'
      - name: Verify Python boundaries and producer/asset parity
        run: python -m pytest tool/python/tests/test_pattern_catalogue_boundary.py tool/python/tests/test_collection_assets.py tool/python/tests/test_collection_transform.py tool/python/tests/test_state_reducer.py -q --junitxml=python-refactor-junit.xml
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-refactor-junit
          path: python-refactor-junit.xml
          if-no-files-found: error

  node:
    name: JavaScript async boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node built-in unit tests
        run: node --test tool/javascript/tests/*.test.mjs

  flutter:
    name: Flutter shared boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: flutter pub get
      - name: Shared data-processing widget tests
        run: flutter test test/features/data_processing_patterns/structure_assets_test.dart test/features/data_processing_patterns/command_assets_test.dart test/features/data_processing_patterns/legacy_catalogue_views_test.dart test/features/data_processing_patterns/native_state_catalogue_test.dart test/features/data_processing_patterns/native_notifier_test.dart test/features/data_processing_patterns/inherited_catalogue_test.dart --reporter expanded
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos
      - name: Build Flutter web
        run: flutter build web
