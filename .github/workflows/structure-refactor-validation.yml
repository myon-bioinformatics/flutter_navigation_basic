name: Refactor smoke

# A lightweight, reusable gate for stacked refactoring branches.
# The broad main-targeted matrix remains the integration gate.
on:
  push:
    branches:
      - 'work/**'
  pull_request:
    branches:
      - main
      - 'work/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/python/**'
      - 'tool/ci/numbered_routes.toml'
      - 'tool/javascript/**'
      - 'assets/data_processing/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/structure-refactor-validation.yml'
  workflow_dispatch:

concurrency:
  group: refactor-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python producer regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install 'pytest>=8'
      - name: Verify Python boundaries and producer/asset parity
        run: python -m pytest tool/python/tests/test_pattern_catalogue_boundary.py tool/python/tests/test_collection_assets.py tool/python/tests/test_collection_transform.py tool/python/tests/test_state_reducer.py tool/python/tests/test_workflow_patterns.py tool/python/tests/test_validation_patterns.py tool/python/tests/test_conversion_patterns.py tool/python/tests/test_validation_http.py tool/python/tests/test_upload_artifact_version.py tool/python/tests/test_pattern_responsibility_audit.py tool/python/tests/test_render_pattern_status.py tool/python/tests/test_check_route_observations.py tool/python/tests/test_node_test_runner.py tool/python/tests/test_multi_test_runner.py -q --junitxml=python-refactor-junit.xml
      - name: Export responsibility inventory
        run: python -S tool/python/pattern_responsibility_audit.py --json --check > pattern-responsibility.json
      - name: Render all 198 pattern statuses
        run: |
          # On pull_request, github.sha is the merge ref; report the PR head and
          # name the merged tree that was actually audited.
          python3 -S tool/python/render_pattern_status.py pattern-responsibility.json pattern-status.md \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" --tree "$(git rev-parse HEAD)"
      - name: Upload readable 198-pattern status report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-pattern-status-198
          path: pattern-status.md
          if-no-files-found: error
      - name: Upload responsibility inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-pattern-responsibility
          path: pattern-responsibility.json
          if-no-files-found: ignore
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-python-refactor
          path: python-refactor-junit.xml
          if-no-files-found: error

  flutter:
    name: Flutter shared boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: flutter pub get
      - name: Shared data-processing widget tests
        env:
          ROUTE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ROUTE_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p build/test-results
          flutter test test/features/data_processing_patterns/structure_assets_test.dart test/features/data_processing_patterns/command_assets_test.dart test/features/data_processing_patterns/legacy_catalogue_views_test.dart test/features/data_processing_patterns/native_state_catalogue_test.dart test/features/data_processing_patterns/native_notifier_test.dart test/features/data_processing_patterns/inherited_catalogue_test.dart test/features/data_processing_patterns/state_architecture_test.dart test/features/data_processing_patterns/counter_architecture_test.dart test/features/data_processing_patterns/interactive_pattern_example_test.dart test/features/data_processing_patterns/validation_pattern_links_test.dart test/features/data_processing_patterns/conversion_pattern_links_test.dart test/core/navigation/numbered_routes_observation_test.dart test/shared/http/curl_import_entry_test.dart --reporter expanded --file-reporter json:build/test-results/flutter-events.jsonl
      - name: Compare observed numbered routes with the hand-written TOML
        if: always()
        # Folded scalar: no shell line continuations needed (a plain scalar keeps
        # "\\" literally and bash then passes stray "\" arguments).
        run: >-
          python3 -S tool/python/check_route_observations.py build/test-results/route-observations.json
          --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --run-id "${{ github.run_id }}"
          --receipt build/test-results/route-verification.json
      - name: Export route-verified responsibility inventory
        if: always()
        run: |
          python3 -S tool/python/pattern_responsibility_audit.py --json --check \
            --route-verification build/test-results/route-verification.json \
            --route-head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --route-run-id "${{ github.run_id }}" \
            > build/test-results/pattern-responsibility-verified.json

      - name: Commit-pinned validation link widget tests
        if: always()
        run: |
          flutter test test/features/data_processing_patterns/validation_pattern_links_test.dart \
            test/features/data_processing_patterns/conversion_pattern_links_test.dart \
            --dart-define=SOURCE_REF=${{ github.event.pull_request.head.sha || github.sha }} \
            --reporter expanded --file-reporter json:build/test-results/flutter-pinned-events.jsonl
      - name: Python-runtime curl entry contract
        if: always()
        # Same file as above, compiled the way the Docker runtime build is, so
        # importCurlText must route to Python and never parse locally.
        run: |
          flutter test test/shared/http/curl_import_entry_test.dart \
            --dart-define=CURL_PYTHON_RUNTIME=true --dart-define=CURL_RUNTIME_EXPECTED=true \
            --reporter expanded --file-reporter json:build/test-results/flutter-curl-runtime-events.jsonl
      - name: Convert and validate Flutter JUnit
        if: always()
        run: |
          set -euo pipefail
          python3 -S tool/python/flutter_machine_junit.py build/test-results/flutter-events.jsonl build/test-results/flutter.xml
          python3 -S tool/python/validate_runner_junit.py build/test-results/flutter.xml
          python3 -S tool/python/flutter_machine_junit.py build/test-results/flutter-pinned-events.jsonl build/test-results/flutter-pinned.xml
          python3 -S tool/python/validate_runner_junit.py build/test-results/flutter-pinned.xml
          python3 -S tool/python/flutter_machine_junit.py build/test-results/flutter-curl-runtime-events.jsonl build/test-results/flutter-curl-runtime.xml
          python3 -S tool/python/validate_runner_junit.py build/test-results/flutter-curl-runtime.xml
      - name: Preserve Flutter JUnit and raw events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-flutter-refactor
          path: |
            build/test-results/flutter.xml
            build/test-results/flutter-pinned.xml
            build/test-results/flutter-pinned-events.jsonl
            build/test-results/flutter-curl-runtime.xml
            build/test-results/flutter-curl-runtime-events.jsonl
            build/test-results/route-observations.json
            build/test-results/route-verification.json
            build/test-results/pattern-responsibility-verified.json
            build/test-results/flutter-events.jsonl
          if-no-files-found: error
      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos
      - name: Build Flutter web
        run: flutter build web

  node:
    name: JavaScript async boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Execute real Node tests with native JUnit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/test-results
          python3 -S tool/python/test.py --node \
            --node-report build/test-results/node.xml \
            --node-receipt build/test-results/node-summary.json
      - name: Validate native JUnit report
        if: always()
        run: python3 -S tool/python/validate_runner_junit.py build/test-results/node.xml
      - name: Preserve Node JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-node-refactor
          path: build/test-results/node.xml
          if-no-files-found: error

  # The shared collector reads only junit-* artifacts of this run, so every lane
  # above is named junit-<lane>-refactor. A lane that produced no XML (or one that
  # failed before writing it) makes collection fail instead of looking green.
  junit-identity:
    name: Refactor JUnit identity
    needs: [python, flutter, node]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@b000e5967cb7596f6f9f20fe396a686fdc700c16
    with:
      expected-reports: '["junit-python-refactor/python-refactor-junit.xml", "junit-node-refactor/node.xml", "junit-flutter-refactor/flutter.xml", "junit-flutter-refactor/flutter-pinned.xml", "junit-flutter-refactor/flutter-curl-runtime.xml"]'
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
