name: Diagnostics screenshot evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/shared/diagnostics/**'
      - 'lib/shared/widgets/home_overview_panel.dart'
      - 'lib/features/home/**'
      - 'tool/src/repository_metadata.dart'
      - 'tool/python/**'
      - 'e2e/**'
      - '.github/workflows/diagnostics-evidence.yml'
      - '.github/workflows/flutter-pages.yml'
  push:
    branches: [main]
    paths:
      - 'lib/shared/diagnostics/**'
      - 'lib/shared/widgets/home_overview_panel.dart'
      - 'lib/features/home/**'
      - 'tool/src/repository_metadata.dart'
      - 'tool/python/**'
      - 'e2e/**'
      - '.github/workflows/diagnostics-evidence.yml'
      - '.github/workflows/flutter-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnostics-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check out pinned browser-test-kit validators
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/browser-test-kit
          ref: 3a054c777a98300ee272e4458990b849c32a7ef0
          path: .browser-test-kit
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the Pages entrypoint with canonical metadata
        run: |
          flutter pub get
          python3 tool/python/generate_repository_metadata.py --expected-sha "$EXPECTED_SHA"
          dart run tool/dev.dart meta --platform web --repository-metadata build/diagnostics/repository/repository-metadata.json
          flutter build web --release -t lib/main.dart --base-href '/'
      - name: Install browsers
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium firefox webkit
      - name: Assert visible metadata and capture success evidence
        working-directory: e2e
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory ../build/web &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            if [[ "$attempt" == "30" ]]; then
              echo "Timed out waiting for the local server" >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          npx playwright test tests/diagnostics_evidence.spec.ts --project=chromium --project=firefox --project=webkit --project=mobile-webkit
      - name: Validate project capture sets and canonical provenance
        run: |
          python3 -S .browser-test-kit/scripts/check_capture_evidence.py e2e/test-results \
            --expect chromium,firefox,webkit,mobile-webkit \
            --captures home.png,build-diagnostics.png \
            --sha "$EXPECTED_SHA" \
            --canonical build/diagnostics/repository/repository-metadata.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Check application-specific capture guards
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for receipt in Path('e2e/test-results').rglob('evidence.json'):
              data = json.loads(receipt.read_text())
              if data.get('stage', 'complete') != 'complete':
                  continue
              assert all(c['bytes'] > 1000 for c in data['captures']), receipt
              assert len({c['sha256'] for c in data['captures']}) == 2, receipt
          PY
      - name: Upload screenshots, receipts and browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-evidence-${{ env.EXPECTED_SHA }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            build/diagnostics/repository/
          if-no-files-found: error
          retention-days: 14
