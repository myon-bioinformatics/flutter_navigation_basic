name: CI failure label (add only)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: ci-failure-label-add-only
  cancel-in-progress: false
jobs:
  label:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, repository-reviewed pin
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Add confirmed latest-head failure labels; hold all removals
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -B .github/scripts/add_ci_label.py
