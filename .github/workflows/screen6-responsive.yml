name: Screen6 responsive regression

on:
  pull_request:
    paths:
      - 'lib/screens/generic_screen.dart'
      - 'e2e/tests/screen_navigation.spec.ts'
      - '.github/workflows/screen6-responsive.yml'

permissions:
  contents: read

jobs:
  screen6:
    # Match the portable E2E OS baseline while comparing production WebKit
    # delays from run 40899946824; keep browsers, workers and budgets unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build production entrypoint without E2E defines
        run: |
          flutter pub get
          flutter build web --release -t lib/main.dart --base-href /
      - name: Install existing browser test tools
        working-directory: e2e
        run: |
          npm install
          npx playwright --version
          npx playwright install --with-deps --only-shell chromium firefox webkit
      # One-time diagnostic: remove after preserving its receipt, then require
      # every final-head workflow again. It is never a mergeable CI exception.
      - name: Prove revised mobile regression detects the old query loss
        env:
          FLUTTER_WEB_BASE_URL: http://127.0.0.1:8081
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: ../build/screen6-baseline-report
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../build/screen6-baseline-negative.xml
        run: |
          set -euo pipefail
          baseline=dd32a8cadb37fae1fbec38e349410ed6527635a7
          source=lib/screens/generic_screen.dart
          fixed_source=$(mktemp)
          cp "$source" "$fixed_source"
          cp -a build/web build/screen6-fixed-web
          fixed_js_sha=$(sha256sum build/web/main.dart.js | cut -d " " -f 1)
          server_pid=
          restore_fixed() {
            cp "$fixed_source" "$source"
            if [ -d build/screen6-fixed-web ]; then
              rm -rf build/web
              mv build/screen6-fixed-web build/web
            fi
            echo "$fixed_js_sha  build/web/main.dart.js" | sha256sum --check
          }
          trap 'restore_fixed; rm -f "$fixed_source"; if [ -n "$server_pid" ]; then kill "$server_pid" || true; fi' EXIT
          git fetch --no-tags --depth=1 origin "$baseline"
          git show "$baseline:$source" > "$source"
          echo "Negative baseline source: $(git hash-object "$source") from $baseline"
          # Match the existing portable lane's semantics bootstrap on BOTH builds.
          flutter build web --release -t lib/main.dart --dart-define=E2E=true --base-href /
          python3 -m http.server 8081 --directory build/web &
          server_pid=$!
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8081/', timeout=1).close()
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
          set +e
          (cd e2e && npx playwright test tests/screen_navigation.spec.ts --grep 'preserves search across resize' --project=mobile-chromium --project=mobile-webkit --output=../build/screen6-baseline-results)
          baseline_exit=$?
          set -e
          python3 - "$baseline_exit" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          assert sys.argv[1] == '1', f'Expected test assertion failures, got exit {sys.argv[1]}'
          root = ET.parse('build/screen6-baseline-negative.xml').getroot()
          cases = [(suite.attrib['hostname'], case)
                   for suite in root.iter('testsuite') for case in suite.findall('testcase')]
          expected = {(browser, f'Screen6 preserves search across resize from {height} {contract} @portable')
                      for browser in ('mobile-chromium', 'mobile-webkit') for height in (757, 500)
                      for contract in ('roundtrip', 'boundary-edges')}
          assert len(cases) == 8
          assert {(browser, case.attrib['name']) for browser, case in cases} == expected
          for browser, case in cases:
              failure = case.find('failure')
              assert failure is not None and case.find('error') is None and case.find('skipped') is None
              detail = re.sub(r'\x1b\[[0-9;]*m', '', ''.join(failure.itertext()))
              assert 'at expectRetainedEditor' in detail
              assert 'toHaveValue' in detail and 'Transformed Result List' in detail
              assert re.search(r'Received:\s*""', detail), (browser, case.attrib['name'], detail)
          print('Negative control: all 8 mobile cases failed on the identified empty-query regression; only identified query-loss assertions accepted.')
          PY
          cp "$fixed_source" "$source"
          test "$(git hash-object "$source")" = "$(git rev-parse "HEAD:$source")"
          flutter build web --release -t lib/main.dart --dart-define=E2E=true --base-href /
          # Same tests, E2E flags and browser profiles must now succeed. The trap
          # restores/verifies the saved production build for the desktop step.
          (cd e2e && PLAYWRIGHT_JUNIT_OUTPUT_FILE=../build/screen6-fixed-mobile.xml PLAYWRIGHT_HTML_OUTPUT_DIR=../build/screen6-fixed-mobile-report npx playwright test tests/screen_navigation.spec.ts --grep 'preserves search across resize' --project=mobile-chromium --project=mobile-webkit --output=../build/screen6-fixed-mobile-results)
      - name: Verify mouse, keyboard and stateful resize across compact boundary
        working-directory: e2e
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: screen6-junit.xml
        run: |
          python3 -m http.server 8080 --directory ../build/web &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/', timeout=1).close()
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
          npx playwright test tests/screen_navigation.spec.ts --grep 'stays inside body|preserves search across resize' --project=chromium --project=firefox --project=webkit
      - name: Retain geometry, screenshots and failures separately from audit 223
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen6-responsive
          path: |
            build/screen6-baseline-negative.xml
            build/screen6-baseline-results/
            build/screen6-baseline-report/
            build/screen6-fixed-mobile.xml
            build/screen6-fixed-mobile-results/
            build/screen6-fixed-mobile-report/
            e2e/screen6-junit.xml
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: error
          retention-days: 14
