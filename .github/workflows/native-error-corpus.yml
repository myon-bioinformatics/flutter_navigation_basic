name: One-shot native error corpus

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Optional seed to replay a bounded native case manifest
        required: false
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: native-error-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'capture-native-errors' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Capture ${{ matrix.language }} and compare Python / Node
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: dart
            runner: ubuntu-latest
          - language: kotlin
            runner: ubuntu-latest
          - language: swift
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/xprobe
          ref: 1fddf44b1afdccfa91c801891e7a806c8e8f7d18
          path: .native-probe-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        if: matrix.language == 'kotlin'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Prepare Flutter application dependencies
        run: flutter pub get
      - name: Build once and measure native / Python / Node controls
        env:
          CAPTURE_LANGUAGE: ${{ matrix.language }}
          CAPTURE_SEED: ${{ inputs.seed || format('{0}:{1}', github.run_id, github.run_attempt) }}
        shell: bash
        run: |
          ulimit -c 0
          python -S python/capture_native_errors.py --language "$CAPTURE_LANGUAGE" --output "build/native-error-corpus/$CAPTURE_LANGUAGE" --probe-tools .native-probe-tools --seed "$CAPTURE_SEED"
      - name: Preserve actual failures and acceptance results separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-error-corpus-${{ matrix.language }}
          path: build/native-error-corpus/${{ matrix.language }}/
          if-no-files-found: error
          retention-days: 90

