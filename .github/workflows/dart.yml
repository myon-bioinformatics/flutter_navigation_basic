name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Rapid PR pushes cancel superseded runs so pinned/Android Flutter setup
# is not paid for abandoned SHAs.
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      android: ${{ steps.filter.outputs.android }}
      python: ${{ steps.filter.outputs.python }}
      patterns: ${{ steps.filter.outputs.patterns }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: Classify changed paths
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # main pushes always run the full matrix (Pages depends on green Flutter).
            {
              echo "flutter=true"
              echo "android=true"
              echo "python=true"
              echo "patterns=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only "$BASE" "$HEAD")

          flutter=false
          android=false
          python=false
          patterns=false
          for f in "${files[@]}"; do
            case "$f" in
              # Shared goldens: Python oracle + Dart consumers must both run.
              python/fixtures/*)
                python=true
                flutter=true
                ;;
              python/generate_pattern_smoke_test.py|python/check_pattern_smoke_mutations.py|python/tests/test_pattern_smoke_generator.py|python/pattern_contracts.py|python/metadata_contracts.py|python/generate_pattern_contracts.py|python/tests/test_pattern_contracts.py|python/tests/test_metadata_contracts.py|python/generate_repository_metadata.py)
                python=true
                flutter=true
                ;;
              python/*)
                python=true
                ;;
              lib/*|test/*|assets/*|web/*|android/*|ios/*|linux/*|macos/*|windows/*|pubspec.yaml|pubspec.lock|analysis_options.yaml|javascript/*|ci/*|docker/*|build_tools/*|.github/workflows/dart.yml)
                flutter=true
                ;;
            esac
            case "$f" in
              android/*|lib/*|assets/*|pubspec.yaml|pubspec.lock)
                android=true
                ;;
            esac
            case "$f" in
              # Pattern catalogue sources, generated smoke, and their CI selection.
              test/features/*_patterns/*|python/generate_pattern_smoke_test.py|python/check_pattern_smoke_mutations.py|python/tests/test_pattern_smoke_generator.py|.github/workflows/dart.yml|lib/features/*_patterns/*|assets/screens.json|ci/flutter_pattern_test_paths.txt|lib/core/services/base_controller.dart|pubspec.yaml|pubspec.lock)
                patterns=true
                ;;
            esac
          done

          # Workflow / CI path-list edits still need a Flutter smoke.
          # Native test lanes live in dart.yml — keep Android on when it changes.
          for f in "${files[@]}"; do
            if [[ "$f" == ".github/workflows/dart.yml" ]]; then
              flutter=true
              android=true
            elif [[ "$f" == ".github/workflows/non-dart.yml" || "$f" == ci/* ]]; then
              flutter=true
            fi
          done

          {
            echo "flutter=$flutter"
            echo "android=$android"
            echo "python=$python"
            echo "patterns=$patterns"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Changed files (${#files[@]}):"
            printf '%s\n' "${files[@]}"
            echo "outputs: flutter=$flutter android=$android python=$python patterns=$patterns"
          }

  gate:
    name: Pinned gate 3.47.0
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: |
          if ! git diff --exit-code -- pubspec.lock; then
            echo "::error::pubspec.lock is stale for Flutter 3.47.0. Commit the generated CI lockfile."
            exit 1
          fi

      - name: Verify handcrafted shell is GetX-free
        run: |
          if grep -R -n "package:get/get.dart" \
            lib/main.dart \
            lib/core/navigation/app_navigation.dart \
            lib/features/home \
            lib/features/now_timeline \
            lib/features/counter_playground \
            lib/features/irony_generator \
            lib/features/composition_generator \
            lib/features/screen5; then
            echo "::error::GetX coupling reintroduced into the handcrafted application shell."
            exit 1
          fi

      - name: Inspect repository with shared toolkit
        run: dart run build_tools/inspect.dart --json

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      - name: Export and validate production Dart contracts
        run: |
          set -euo pipefail
          python3 -S python/generate_pattern_contracts.py --check
          dart run build_tools/export_pattern_contracts.dart build/test-results/pattern-contracts.json
          python3 -S python/pattern_contracts.py build/test-results/pattern-contracts.json --junit build/test-results/pattern-contracts.xml
          python3 -S python/validate_runner_junit.py build/test-results/pattern-contracts.xml

      - name: Preserve Dart contract JSON and Python JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-dart-contracts
          path: |
            build/test-results/pattern-contracts.json
            build/test-results/pattern-contracts.xml
          if-no-files-found: error
          retention-days: 14

      - name: Build Flutter web
        run: flutter build web --release --base-href "/flutter_navigation_basic/"


  # Pinned core product suites and the thin production-metadata JSON exporter.
  unit-tests:
    name: Pinned core shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run sharded core tests
        run: |
          mapfile -t paths < <(grep -vE '^\s*(#|$)' ci/flutter_core_test_paths.txt)
          mkdir -p build/test-results
          flutter test --total-shards=2 --shard-index=${{ matrix.shard }} "${paths[@]}" --file-reporter json:build/test-results/flutter-core-${{ matrix.shard }}.jsonl

      - name: Convert and validate core shard JUnit
        if: always()
        run: |
          set -euo pipefail
          python3 -S python/flutter_machine_junit.py build/test-results/flutter-core-${{ matrix.shard }}.jsonl build/test-results/flutter-core-${{ matrix.shard }}.xml
          python3 -S python/validate_runner_junit.py build/test-results/flutter-core-${{ matrix.shard }}.xml

      - name: Preserve core shard JUnit and raw events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-flutter-core-${{ matrix.shard }}
          path: |
            build/test-results/flutter-core-${{ matrix.shard }}.xml
            build/test-results/flutter-core-${{ matrix.shard }}.jsonl
            build/test-results/metadata-contracts.json
          if-no-files-found: error
          retention-days: 14

  # Generated catalogue smoke, dedicated models, and data-processing suites.
  # Independent Dart -> Python contracts also run in the pinned gate.
  # pattern sources/tests or the pattern path list change (always on main).
  unit-tests-patterns:
    name: Pinned patterns shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.flutter == 'true' && needs.changes.outputs.patterns == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated pattern smoke test is current
        run: python3 -S python/generate_pattern_smoke_test.py --check

      - name: Verify smoke rejects real service mutations
        if: matrix.shard == 0
        run: python3 -S python/check_pattern_smoke_mutations.py

      - name: Preserve expected mutation failures
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v7
        with:
          name: pattern-smoke-mutation-evidence
          path: build/test-results/pattern-smoke-mutations/
          if-no-files-found: error
          retention-days: 14

      - name: Run sharded pattern catalogue tests
        run: |
          mapfile -t paths < <(grep -vE '^\s*(#|$)' ci/flutter_pattern_test_paths.txt)
          mkdir -p build/test-results
          flutter test --total-shards=4 --shard-index=${{ matrix.shard }} "${paths[@]}" --file-reporter json:build/test-results/flutter-patterns-${{ matrix.shard }}.jsonl

      - name: Convert and validate patterns shard JUnit
        if: always()
        run: |
          set -euo pipefail
          python3 -S python/flutter_machine_junit.py build/test-results/flutter-patterns-${{ matrix.shard }}.jsonl build/test-results/flutter-patterns-${{ matrix.shard }}.xml
          python3 -S python/validate_runner_junit.py build/test-results/flutter-patterns-${{ matrix.shard }}.xml

      - name: Preserve patterns shard JUnit and raw events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-flutter-patterns-${{ matrix.shard }}
          path: |
            build/test-results/flutter-patterns-${{ matrix.shard }}.xml
            build/test-results/flutter-patterns-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          retention-days: 14

  # Compatibility smoke on unpinned stable SDK and upgraded packages: core suites only.
  # Pattern catalogues run in unit-tests-patterns when those paths change.
  latest-stable:
    name: Latest stable shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - uses: actions/checkout@v7

      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve current stable packages with latest stable toolchain
        run: flutter pub upgrade

      - name: Verify resolved direct packages are latest stable
        if: matrix.shard == 0
        run: dart run build_tools/check_versions.dart

      - name: Analyze on latest stable
        if: matrix.shard == 0
        run: flutter analyze --no-fatal-infos

      - name: Run core (non-pattern) sharded tests on latest stable
        run: |
          mapfile -t paths < <(grep -vE '^\s*(#|$)' ci/flutter_core_test_paths.txt)
          mkdir -p build/test-results
          flutter test --total-shards=2 --shard-index=${{ matrix.shard }} "${paths[@]}" --file-reporter json:build/test-results/flutter-latest-${{ matrix.shard }}.jsonl

      - name: Convert and validate latest stable shard JUnit
        if: always()
        run: |
          set -euo pipefail
          python3 -S python/flutter_machine_junit.py build/test-results/flutter-latest-${{ matrix.shard }}.jsonl build/test-results/flutter-latest-${{ matrix.shard }}.xml
          python3 -S python/validate_runner_junit.py build/test-results/flutter-latest-${{ matrix.shard }}.xml

      - name: Preserve latest stable shard JUnit and raw events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-flutter-latest-${{ matrix.shard }}
          path: |
            build/test-results/flutter-latest-${{ matrix.shard }}.xml
            build/test-results/flutter-latest-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Build canonical web entrypoint on latest stable
        if: matrix.shard == 0
        run: flutter build web --release -t lib/main.dart --base-href "/flutter_navigation_basic/"

  # The shared collector reads junit-* artifacts of this run only. Plan the
  # expected reports from the same path-filter outputs the shard jobs use, so a
  # skipped lane is not "missing" and a selected lane cannot go unchecked.
  junit-plan:
    name: Plan expected Flutter JUnit reports
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      reports: ${{ steps.plan.outputs.reports }}
    steps:
      - id: plan
        env:
          FLUTTER: ${{ needs.changes.outputs.flutter == 'true' }}
          PATTERNS: ${{ needs.changes.outputs.flutter == 'true' && needs.changes.outputs.patterns == 'true' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          reports = []
          if os.environ["FLUTTER"] == "true":
              reports += ["junit-dart-contracts/pattern-contracts.xml"]
              reports += [f"junit-flutter-core-{n}/flutter-core-{n}.xml" for n in range(2)]
              reports += [f"junit-flutter-latest-{n}/flutter-latest-{n}.xml" for n in range(2)]
          if os.environ["PATTERNS"] == "true":
              reports += [f"junit-flutter-patterns-{n}/flutter-patterns-{n}.xml" for n in range(4)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("run=" + ("true" if reports else "false") + "\n")
              output.write("reports=" + json.dumps(reports) + "\n")
          PY

  junit-identity:
    needs: [changes, junit-plan, gate, unit-tests, unit-tests-patterns, latest-stable]
    if: always() && needs.junit-plan.outputs.run == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
    with:
      expected-reports: ${{ needs.junit-plan.outputs.reports }}
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # Flutter + Gradle startup is expensive; skip on PRs that cannot affect size.
  android-size:
    name: Android arm64 release size
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Measure canonical Android arm64 release
        run: dart run build_tools/dev.dart size

      - name: Show size summary
        run: cat build/diagnostics/android-arm64/summary.txt

      - name: Upload size diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: android-arm64-size-diagnostics
          path: build/diagnostics/android-arm64/
          if-no-files-found: error
          retention-days: 30

  # JVM unit tests for native normalize helpers (pixel gate / EXIF / lifecycle).
  android-unit-tests:
    name: Android JVM unit tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Run app JVM unit tests
        run: |
          set -euo pipefail
          mkdir -p build
          # Wrapper scripts are committed; Flutter writes local.properties (sdk.dir).
          cd android
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --info | tee ../build/android-unit-tests.log
          grep -E 'ImageNormalizeSupportTest|NormalizeExecutorControllerTest' ../build/android-unit-tests.log

      - name: Upload JVM test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-jvm-unit-tests
          path: build/android-unit-tests.log
          if-no-files-found: warn
          retention-days: 14
