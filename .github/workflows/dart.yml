name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Rapid PR pushes cancel superseded runs so pinned/Android Flutter setup
# is not paid for abandoned SHAs.
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      android: ${{ steps.filter.outputs.android }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Classify changed paths
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # main pushes always run the full matrix (Pages depends on green Flutter).
            echo "flutter=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only "$BASE" "$HEAD")

          flutter=false
          android=false
          python=false
          for f in "${files[@]}"; do
            case "$f" in
              tool/python/*)
                python=true
                ;;
              lib/*|test/*|assets/*|web/*|android/*|ios/*|linux/*|macos/*|windows/*|pubspec.yaml|pubspec.lock|analysis_options.yaml|tool/*|.github/workflows/dart.yml)
                flutter=true
                ;;
            esac
            case "$f" in
              android/*|lib/*|assets/*|pubspec.yaml|pubspec.lock)
                android=true
                ;;
            esac
          done

          # Workflow-only edits still need a Flutter smoke (gate/paths list).
          for f in "${files[@]}"; do
            if [[ "$f" == ".github/workflows/dart.yml" || "$f" == tool/ci/* ]]; then
              flutter=true
            fi
          done

          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          {
            echo "Changed files (${#files[@]}):"
            printf '%s\n' "${files[@]}"
            echo "outputs: flutter=$flutter android=$android python=$python"
          }

  gate:
    name: Pinned gate 3.47.0
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: |
          if ! git diff --exit-code -- pubspec.lock; then
            echo "::error::pubspec.lock is stale for Flutter 3.47.0. Commit the generated CI lockfile."
            exit 1
          fi

      - name: Verify handcrafted shell is GetX-free
        run: |
          if grep -R -n "package:get/get.dart" \
            lib/main_prod.dart \
            lib/core/navigation/app_navigation.dart \
            lib/features/home \
            lib/features/now_timeline \
            lib/features/counter_playground \
            lib/features/irony_generator \
            lib/features/composition_generator \
            lib/features/screen5; then
            echo "::error::GetX coupling reintroduced into the handcrafted application shell."
            exit 1
          fi

      - name: Verify Python requirements stay allowlisted
        run: |
          mapfile -t reqs < <(git ls-files | grep -E '(^|/)requirements\.txt$' || true)
          for path in "${reqs[@]}"; do
            if [[ "$path" != "tool/python/requirements.txt" ]]; then
              echo "::error::Only tool/python/requirements.txt is allowed for pip deps. Found: $path"
              exit 1
            fi
          done

      - name: Verify stdlib timezone oracle
        run: |
          python3 tool/time/verify_timezone.py
          python3 tool/time/generate_timezone_cases.py --check

      - name: Inspect repository with shared toolkit
        run: dart run tool/inspect.dart --json

      - name: Verify direct packages are latest stable
        run: dart run tool/check_versions.dart

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      - name: Build Flutter web
        run: flutter build web --release --base-href "/flutter_navigation_basic/"

      - name: Build production entrypoint
        run: flutter build web --release -t lib/main_prod.dart --base-href "/flutter_navigation_basic/"

  unit-tests:
    name: Pinned tests shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run sharded tests
        run: flutter test --total-shards=4 --shard-index=${{ matrix.shard }}

  python-oracle:
    name: Python pytest oracles
    needs: changes
    # Cheap (~10s): run when Python or Flutter surfaces change; skip pure docs.
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/python/requirements.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tool/python/requirements.txt

      - name: Run pytest
        run: python tool/python/test.py --pytest -- --oracle-mode=local --outcomes-json build/diagnostics/python-oracle/pytest_outcomes.json

      - name: Write local oracle receipt
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path("build/diagnostics/python-oracle")
          out.mkdir(parents=True, exist_ok=True)
          outcomes_path = out / "pytest_outcomes.json"
          outcomes = {}
          if outcomes_path.is_file():
              outcomes = json.loads(outcomes_path.read_text(encoding="utf-8"))
          receipt = {
              "job": "python-oracle",
              "mode": "local",
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "run_id": ${{ github.run_id }},
              "run_attempt": ${{ github.run_attempt }},
              "server_url": "${{ github.server_url }}",
              "outcomes": outcomes.get("counts", {}),
              "outcomes_total": outcomes.get("total"),
              "outcomes_ok": outcomes.get("ok"),
          }
          (out / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          print((out / "receipt.json").read_text(encoding="utf-8"))
          PY
          python3 -m json.tool build/diagnostics/python-oracle/receipt.json > /dev/null

      - name: Upload python oracle summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-oracle-summary
          path: build/diagnostics/python-oracle/
          if-no-files-found: error
          retention-days: 14

  # Compatibility smoke on unpinned stable: core suites only.
  # Pattern catalogues (~792 files) stay on pinned shards — suite-load cost
  # dominated wall time without a single outlier test to skip.
  latest-stable:
    name: Latest stable shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - uses: actions/checkout@v4

      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve with latest stable toolchain
        run: flutter pub get

      - name: Analyze on latest stable
        if: matrix.shard == 0
        run: flutter analyze --no-fatal-infos

      - name: Run core (non-pattern) sharded tests on latest stable
        run: |
          mapfile -t paths < <(grep -vE '^\s*(#|$)' tool/ci/flutter_core_test_paths.txt)
          flutter test --total-shards=2 --shard-index=${{ matrix.shard }} "${paths[@]}"

      - name: Build production entrypoint on latest stable
        if: matrix.shard == 0
        run: flutter build web --release -t lib/main_prod.dart --base-href "/flutter_navigation_basic/"

  # Flutter + Gradle startup is expensive; skip on PRs that cannot affect size.
  android-size:
    name: Android arm64 release size
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Measure production Android arm64 release
        run: dart run tool/dev.dart size

      - name: Show size summary
        run: cat build/diagnostics/android-arm64/summary.txt

      - name: Upload size diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-size-diagnostics
          path: build/diagnostics/android-arm64/
          if-no-files-found: error
          retention-days: 30
