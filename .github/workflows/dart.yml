name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: |
          if ! git diff --exit-code -- pubspec.lock; then
            echo "::error::pubspec.lock is stale. Run 'flutter pub get' with the repository Flutter toolchain and commit the result."
            exit 1
          fi

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Flutter web
        run: flutter build web --release --base-href "/flutter_navigation_basic/"
