name: Python curl runtime browser contract

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile.e2e"
      - ".dockerignore"
      - "tool/docker/**"
      - "tool/python/curl_*.py"
      - "tool/python/playwright.py"
      - "tool/python/vendor/**"
      - "tool/python/tests/test_curl*.py"
      - "tool/python/tests/test_docker_curl_runtime.py"
      - "lib/shared/http/**"
      - "lib/core/platform/**"
      - "lib/features/http_request_draft/**"
      - "test/features/http_request_draft/**"
      - "test/shared/http/**"
      - "e2e/tests/curl_runtime.spec.ts"
      - "e2e/utils/helpers.ts"
      - "e2e/playwright.config.ts"
      - "e2e/package.json"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/curl-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curl-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build shared toolchain and Python-enabled Flutter UI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.e2e
          build-args: CURL_PYTHON_RUNTIME=true
          load: true
          push: false
          tags: flutter-nav-curl-runtime:ci
          cache-from: type=gha,scope=flutter-nav-curl-runtime
          cache-to: type=gha,scope=flutter-nav-curl-runtime,mode=max
      - name: Test real UI to local Python inside Docker
        run: |
          set -euo pipefail
          mkdir -p e2e/test-results build/curl-runtime
          docker image inspect flutter-nav-curl-runtime:ci --format '{{.Id}}' > build/curl-runtime/image-id.txt
          python3 -S tool/python/generate_repository_metadata.py \
            --root . \
            --repository "${GITHUB_REPOSITORY}" \
            --output-dir build/curl-runtime/repository
          # Browser and server share container loopback. No host port or Docker
          # socket is exposed to the app. Use the same checked-in CLI wrapper.
          docker run --rm --init --ipc=host \
            -e PLAYWRIGHT_JUNIT_OUTPUT_FILE=test-results/curl-runtime.xml \
            -v "$PWD/e2e/test-results:/repo/e2e/test-results" \
            -v "$PWD/build/curl-runtime:/repo/build/curl-runtime" \
            flutter-nav-curl-runtime:ci \
            test --project chromium --project firefox --project webkit \
            --project mobile-chromium --project mobile-webkit \
            tests/curl_runtime.spec.ts --reporter=line,junit
      - name: Verify executed cases and screenshot evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = ET.parse("e2e/test-results/curl-runtime.xml")
          cases = list(report.iter("testcase"))
          assert len(cases) >= 30, f"runtime suite not fully collected: {len(cases)}"
          assert not any(case.find(kind) is not None for case in cases for kind in ("failure", "error", "skipped"))
          traces = list(Path("e2e/test-results").rglob("trace.zip"))
          assert len(traces) >= len(cases), "missing browser traces"
          print(f"Docker runtime E2E: {len(cases)} passed, {len(traces)} traces")
          PY
          mapfile -t snapshots < <(find e2e/test-results -name python-curl-import.png -type f)
          test "${#snapshots[@]}" -ge 5
          python3 -S tool/python/vendor/check_png.py "${snapshots[@]}"
      - name: Keep browser snapshots, traces, JUnit and toolchain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curl-runtime-browser-evidence
          path: |
            e2e/test-results/
            build/curl-runtime/
          if-no-files-found: warn
          retention-days: 14
