name: Flutter Web Pages

on:
  # Deploy only after the Flutter workflow finishes on main, so Pages cannot
  # race ahead of failed sharded tests / gate checks on the same commit.
  workflow_run:
    workflows: ["Flutter"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Flutter-gated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Full flutter test is gated by the Flutter workflow with sharded jobs.
      # Pages only builds after that workflow succeeds on main.

      # Refresh after analyze so the mutable diagnostics asset does not change
      # fixture assumptions. The regenerated file is still embedded in the
      # GitHub Pages web build below.
      - name: Refresh source diagnostics metadata
        run: dart run tool/dev.dart meta

      - name: Build Flutter web
        run: flutter build web --release --base-href "/flutter_navigation_basic/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
