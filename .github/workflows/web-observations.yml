name: Published Web page observations

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Optional replay seed (default run ID and attempt)'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/web-observations.yml'
      - 'python/web_page_catalogue.py'
      - 'python/check_web_observations.py'
      - 'e2e/utils/observed_test.ts'
      - 'e2e/tests/page_observations.spec.ts'
      - 'e2e/playwright.config.ts'
      - 'e2e/utils/browser_execution.mjs'
      - 'e2e/utils/flutter_worker_policy.mjs'
      - 'e2e/utils/explore*'
      - 'python/playwright.py'

permissions:
  contents: read

concurrency:
  group: web-observations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing Node test tools and Chromium shell only
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps --only-shell chromium
      - name: Replay Back-navigation capture race on the four observed routes
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/build/test-results/page-navigation-regression.xml
        run: |
          mkdir -p build/test-results
          python python/playwright.py pages --base-url https://myon-bioinformatics.github.io/flutter_navigation_basic/ --light --seed 39029437046:1 --explore-steps 3 --route /screen32 --route /screen87 --route /screen96 --route /screen169 -- --output test-results/page-navigation-regression
          python -S python/check_web_observations.py e2e/test-results/page-navigation-regression
      - name: Replay bounded candidate snapshots for original failure seeds
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          PLAYWRIGHT_JUNIT_OUTPUT_FILE=${{ github.workspace }}/build/test-results/replay-time-timeline.xml python python/playwright.py pages --base-url https://myon-bioinformatics.github.io/flutter_navigation_basic/ --light --seed 39036084029:1 --explore-steps 3 --route /tools/time/now-timeline -- --output test-results/replay-time-timeline
          python -S python/check_web_observations.py e2e/test-results/replay-time-timeline
          PLAYWRIGHT_JUNIT_OUTPUT_FILE=${{ github.workspace }}/build/test-results/replay-screen91.xml python python/playwright.py pages --base-url https://myon-bioinformatics.github.io/flutter_navigation_basic/ --light --seed 39036904077:1 --explore-steps 3 --route /screen91 -- --output test-results/replay-screen91
          python -S python/check_web_observations.py e2e/test-results/replay-screen91
      - name: Observe all public pages without a Flutter or native build
        env:
          PLAYWRIGHT_HTML_OPEN: never
          EXPLORATION_SEED: ${{ inputs.seed || format('{0}:{1}', github.run_id, github.run_attempt) }}
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/build/test-results/published-pages.xml
        run: |
          mkdir -p build/test-results
          python python/playwright.py pages --base-url https://myon-bioinformatics.github.io/flutter_navigation_basic/ --light --seed "$EXPLORATION_SEED" --explore-steps 3 -- --output test-results/published-pages
      - name: Verify saved page coverage and screenshot integrity without a browser
        run: python -S python/check_web_observations.py e2e/test-results/published-pages
      - name: Preserve page observations including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-web-observations
          path: |
            e2e/test-results/published-pages/
            e2e/test-results/page-navigation-regression/
            e2e/test-results/replay-time-timeline/
            e2e/test-results/replay-screen91/
            e2e/playwright-report/
            build/test-results/published-pages.xml
            build/test-results/replay-time-timeline.xml
            build/test-results/replay-screen91.xml
            build/test-results/page-navigation-regression.xml
          if-no-files-found: error
          retention-days: 14
