name: Source-family Flutter discovery diagnostic

# Live browser measurement is manual-only. The current user request is offline
# strengthening, so publication, title edits and synchronization cannot run it.
on:
  workflow_dispatch:
    inputs:
      run_live_audit:
        description: 'Explicitly request a new 48-case live audit (not requested by the current task)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  focused:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_audit == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      AUDIT_OUTPUT: build/flutter-pages-audit/family-discovery-d65322c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test observers and fail-closed evidence contracts
        run: |
          node --test experiments/flutter-pages-audit/audit_policy.test.cjs
          python3 -B -S experiments/flutter-pages-audit/audit_contract.test.py
          python3 -B -S experiments/flutter-pages-audit/family_contract.test.py
          node --test experiments/flutter-pages-audit/semantic_collector.test.cjs
          python3 -B -S experiments/flutter-pages-audit/family_workflow.test.py
      - name: Verify the explicitly reviewed deployment and all family source hashes
        run: |
          python3 -B -S experiments/flutter-pages-audit/family_contract.py preflight "$AUDIT_OUTPUT"
          python3 -B -S experiments/flutter-pages-audit/audit_contract.py catalogue --output build/flutter-pages-audit/catalogue.json
      - name: Install existing browser development dependency
        run: |
          npm install --prefix e2e --package-lock=false
          npm exec --prefix e2e -- playwright install --with-deps chromium
      - name: Discover exactly 24 source structures at two viewports; unknown remains failure
        run: npm exec --prefix e2e -- playwright test --config experiments/flutter-pages-audit/playwright.config.cjs
      - name: Recheck source hashes and deployed baseline after discovery
        if: always()
        run: python3 -B -S experiments/flutter-pages-audit/family_contract.py preflight "$AUDIT_OUTPUT/postflight"
      - name: Validate exactly 48 pairs without claiming full 430 coverage
        if: always()
        run: python3 -B -S experiments/flutter-pages-audit/family_contract.py aggregate "$AUDIT_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flutter-audit-family-discovery-d65322c1
          path: ${{ env.AUDIT_OUTPUT }}/
          if-no-files-found: error
          retention-days: 7
